<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox - Gmail</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="stylesv4.css" />
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
</head>
<body>

  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </button>
    <div class="brand">
      <span class="brand-icon">
        <svg viewBox="0 0 24 24"><path fill="#4285f4" d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </span>
      <span class="brand-text">Gmail</span>
    </div>

    <div class="search-wrap">
      <span class="search-icon">
        <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </span>
      <input type="text" id="searchInput" placeholder="Search mail" autocomplete="off" />
      <button class="search-clear" id="searchClear" aria-label="Clear search">x</button>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
      <button class="avatar-btn" aria-label="Account">
        <span id="avatarLetter">V</span>
      </button>
    </div>
  </header>

  <!-- ============ LAYOUT ============ -->
  <div class="layout">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <button class="compose-btn" id="composeBtn">
        <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        <span>Compose</span>
      </button>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="inbox">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24"><path d="M19 3H4.99c-1.1 0-1.98.9-1.98 2L3 19c0 1.1.89 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z"/></svg>
          </span>
          <span class="nav-label">Inbox</span>
          <span class="nav-count" id="inboxCount"></span>
        </button>

        <button class="nav-item" data-view="starred">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          </span>
          <span class="nav-label">Starred</span>
        </button>

        <button class="nav-item" data-view="snoozed">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24"><path d="M9 11H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2zm2-7h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14v11z"/></svg>
          </span>
          <span class="nav-label">Snoozed</span>
        </button>

        <button class="nav-item" data-view="sent">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </span>
          <span class="nav-label">Sent</span>
        </button>

        <button class="nav-item" data-view="drafts">
          <span class="nav-ico">
            <svg viewBox="0 0 24 24"><path d="M12 15a2 2 0 0 1-2-2 2 2 0 0 1 2-2 2 2 0 0 1 2 2 2 2 0 0 1-2 2zm7-14H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3v2l4-2h7a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2z"/></svg>
          </span>
          <span class="nav-label">Drafts</span>
        </button>

        <button class="nav-item" data-view="moreToggle" id="moreToggle">
          <span class="nav-ico" id="moreToggleIcon">
            <svg viewBox="0 0 24 24"><path d="M16.59 8.59 12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
          </span>
          <span class="nav-label" id="moreToggleLabel">More</span>
        </button>

        <div id="moreItems" class="hidden">
          <button class="nav-item" data-view="important">
            <span class="nav-ico">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </span>
            <span class="nav-label">Important</span>
          </button>
          <button class="nav-item" data-view="trash">
            <span class="nav-ico">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </span>
            <span class="nav-label">Trash</span>
          </button>
          <button class="nav-item" data-view="spam">
            <span class="nav-ico">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </span>
            <span class="nav-label">Spam</span>
          </button>
        </div>

        <div class="nav-labels-title">Labels</div>
        <div id="labelsNav"></div>
      </nav>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="content" id="content">

      <!-- ===== MAIL LIST VIEW ===== -->
      <section class="view" id="mailListView">

        <!-- tabs -->
        <div class="tabs">
          <button class="tab active" data-category="Primary">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Primary
          </button>
          <button class="tab" data-category="Social">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            Social
          </button>
          <button class="tab" data-category="Promotions">
            <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm-2 14-4-4 1.41-1.41L10 13.17l6.59-6.59L18 8l-8 8z"/></svg>
            Promotions
          </button>
        </div>

        <!-- toolbar -->
        <div class="toolbar">
          <button class="icon-btn" id="selectAllBtn" aria-label="Select all">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M19 5v14H5V5h14zm0-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>
          </button>
          <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
          </button>
          <span class="toolbar-count" id="toolbarCount"></span>
          <div class="spacer"></div>
          <button class="icon-btn" id="deleteBtn" aria-label="Delete">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>

        <!-- email list -->
        <div class="email-list" id="emailList"></div>
      </section>

      <!-- ===== EMAIL READING VIEW ===== -->
      <section class="view hidden" id="emailView">
        <div class="email-toolbar">
          <button class="icon-btn" id="backBtn" aria-label="Back">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <button class="icon-btn" id="archiveBtn" aria-label="Archive">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M20.54 5.23 19.15 3.55A1.99 1.99 0 0 0 17.61 3H6.39c-.59 0-1.14.24-1.54.68l-1.39 1.68A2.007 2.007 0 0 0 3 6.83V21c0 .55.45 1 1 1h16c.55 0 1-.45 1-1V6.83c0-.53-.21-1.04-.46-1.6zM5.18 5 6.39 3.55c.06-.05.14-.09.23-.09h10.76c.09 0 .17.04.23.09L18.82 5H5.18zM19 20H5v-4h14v4zm0-6H5V7h14v7z"/></svg>
          </button>
          <button class="icon-btn" id="emailDeleteBtn" aria-label="Delete">
            <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          </button>
        </div>

        <article class="email-content" id="emailContent"></article>
      </section>
    </main>
  </div>

  <!-- ============ COMPOSE MODAL ============ -->
  <div class="compose-overlay hidden" id="composeOverlay">
    <div class="compose-window" id="composeWindow">
      <div class="compose-header">
        <span id="composeTitle">New Message</span>
        <button class="icon-btn compose-close" id="composeClose" aria-label="Close">
          <svg viewBox="0 0 24 24"><path fill="#5f6368" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="compose-body">
        <div class="compose-field">
          <label>To</label>
          <input type="text" id="composeTo" placeholder="Recipients" />
        </div>
        <div class="compose-field">
          <label></label>
          <input type="text" id="composeSubject" placeholder="Subject" />
        </div>
        <textarea id="composeBody" placeholder="Write something..."></textarea>
      </div>
      <div class="compose-footer">
        <button class="send-btn" id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script type="text/javascript" src="mock-data.js"></script>
  <script type="text/javascript" src="app.js"></script>
</body>
</html>
